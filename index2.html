      }
    ];

    // 渲染卡片至瀑布流容器
    const container = document.getElementById('projectsContainer');

    function renderProjects(data) {
      if (!container) return;
      container.innerHTML = data.map(item => `
        <div class="project-card" onclick="openModal(${item.id})">
          <div class="card-img-wrapper">
            <img src="${item.cover}" 
                 alt="${item.title}" 
                 loading="lazy" 
                 onerror="this.onerror=null; this.src='https://placehold.co/600x450?text=圖片路徑未找到';">
            <div class="photo-count-badge">📷 ${item.photoCount} 張全景</div>
          </div>
          <div class="card-info">
            <div class="card-category">${item.category}</div>
            <h3 class="card-title serif">${item.title}</h3>
            <div class="card-meta">${item.meta}</div>
          </div>
        </div>
      `).join('');
    }

    // 初次載入渲染
    renderProjects(projectsData);

    // 分類篩選
    function filterProjects(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'all' && btn.textContent.includes('全部')));
      });

      if (cat === 'all') {
        renderProjects(projectsData);
      } else {
        const filtered = projectsData.filter(p => p.category === cat);
        renderProjects(filtered);
      }
    }

    // 彈窗（Modal）邏輯
    const modal = document.getElementById('projectModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalCategory = document.getElementById('modalCategory');
    const modalDesc = document.getElementById('modalDesc');
    const modalImagesContainer = document.getElementById('modalImagesContainer');

    function openModal(projectId) {
      const project = projectsData.find(p => p.id === projectId);
      if (!project) return;

      modalCategory.textContent = project.category;
      modalTitle.textContent = project.title;
      modalDesc.textContent = `${project.meta} — ${project.desc}`;

      modalImagesContainer.innerHTML = project.gallery.map(img => `
        <div class="modal-gallery-item">
          <img src="${img.url}" 
               alt="${img.caption}" 
               loading="lazy" 
               onerror="this.onerror=null; this.src='https://placehold.co/800x600?text=圖片載入失敗';">
          <p>${img.caption}</p>
        </div>
      `).join('');

      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e.target === modal) closeModalDirect();
    }

    function closeModalDirect() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModalDirect();
      }
    });
  </script>
</body>
</html>
